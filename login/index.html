
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JALworLD IPTV | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/fav/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/fav/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/fav/favicon-16x16.png">
	<link rel="manifest" href="/fav/site.webmanifest">
<style>
:root{
    --blue:#2563eb;
    --violet:#7c3aed;
    --orange:#f97316;
    --dark:#08111f;
    --dark2:#101827;
    --text:#cbd5e1;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--dark);
    color:white;
    overflow:hidden;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    z-index:-3;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(37,99,235,.28),
            transparent 40%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(124,58,237,.28),
            transparent 40%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(249,115,22,.18),
            transparent 40%
        ),
        var(--dark);
}

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    z-index:-2;
}

.orb1{
    width:280px;
    height:280px;
    background:var(--blue);
    left:5%;
    top:15%;
    animation:float1 8s ease-in-out infinite;
}

.orb2{
    width:300px;
    height:300px;
    background:var(--violet);
    right:5%;
    top:10%;
    animation:float2 10s ease-in-out infinite;
}

.orb3{
    width:250px;
    height:250px;
    background:var(--orange);
    bottom:-50px;
    left:40%;
    animation:float3 12s ease-in-out infinite;
}

@keyframes float1{
    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(40px,-35px);
    }
}

@keyframes float2{
    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(-40px,35px);
    }
}

@keyframes float3{
    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(30px,-30px);
    }
}

/* =========================
   LOGIN CONTAINER
========================= */

.login-wrapper{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

/* =========================
   LOGIN BOX
========================= */

.login-box{
    width:100%;
    max-width:450px;

    padding:45px 40px;

    background:rgba(255,255,255,.065);

    border:1px solid rgba(255,255,255,.12);

    border-radius:28px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

    animation:loginAppear .8s ease;
}

@keyframes loginAppear{
    from{
        opacity:0;
        transform:translateY(35px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo img{
    width:320px;
    height:120px;

    object-fit:contain;

    border-radius:18px;

    padding:7px;

    background:#46278f;

    box-shadow:
        0 15px 40px rgba(124,58,237,.35);
}

.logo h1{
    margin-top:16px;

    font-size:26px;
    font-weight:700;
}

.logo p{
    margin-top:5px;

    color:#94a3b8;

    font-size:13px;
}

/* =========================
   TITLE
========================= */

.login-title{
    text-align:center;
    margin-bottom:28px;
}

.login-title h2{
    font-size:30px;
    margin-bottom:7px;
}

.gradient{
    background:linear-gradient(
        90deg,
        #60a5fa,
        #a78bfa,
        #fb923c
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.login-title p{
    color:#94a3b8;
    font-size:14px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;

    font-size:13px;
    font-weight:500;

    color:#cbd5e1;

    margin-bottom:8px;
}

.input-box{
    position:relative;
}

.input-box span{
    position:absolute;

    left:16px;
    top:50%;

    transform:translateY(-50%);

    font-size:17px;

    color:#94a3b8;
}

.input-box input{
    width:100%;

    padding:15px 45px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.1);

    outline:none;

    background:rgba(0,0,0,.25);

    color:white;

    font-family:'Poppins',sans-serif;

    font-size:14px;

    transition:.3s;
}

.input-box input::placeholder{
    color:#64748b;
}

.input-box input:focus{
    border-color:var(--violet);

    box-shadow:
        0 0 0 3px rgba(124,58,237,.12),
        0 10px 30px rgba(0,0,0,.15);
}

.password-toggle{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#94a3b8;

    font-size:15px;

    user-select:none;
}

/* =========================
   FORGOT PASSWORD
========================= */

.options{
    display:flex;
    justify-content:flex-end;

    margin-top:-8px;
    margin-bottom:22px;
}

.forgot{
    color:#93c5fd;

    text-decoration:none;

    font-size:13px;

    transition:.3s;
}

.forgot:hover{
    color:white;
}

/* =========================
   LOGIN BUTTON
========================= */

.login-button{
    width:100%;

    border:none;

    padding:15px;

    border-radius:50px;

    cursor:pointer;

    color:white;

    font-family:'Poppins',sans-serif;

    font-size:15px;

    font-weight:600;

    background:linear-gradient(
        135deg,
        var(--blue),
        var(--violet),
        var(--orange)
    );

    box-shadow:
        0 12px 35px rgba(124,58,237,.35);

    transition:.35s;
}

.login-button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 45px rgba(124,58,237,.5);
}

.login-button:active{
    transform:translateY(0);
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:18px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-size:13px;
}

.message.error{
    display:block;

    background:rgba(239,68,68,.1);

    border:1px solid rgba(239,68,68,.25);

    color:#fca5a5;
}

.message.success{
    display:block;

    background:rgba(34,197,94,.1);

    border:1px solid rgba(34,197,94,.25);

    color:#86efac;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:28px;

    color:#64748b;

    font-size:11px;
}

.footer span{
    color:#94a3b8;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .login-wrapper{
        min-height:100vh;
        padding:18px;
    }

    .login-box{
        padding:32px 24px;

        border-radius:23px;
    }

    .logo img{
    width:320px;
    height:120px;
    }

    .logo h1{
        font-size:22px;
    }

    .login-title h2{
        font-size:26px;
    }

    .input-box input{
        padding:14px 43px;
    }

    .login-button{
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>


<div class="login-wrapper">

    <div class="login-box">

        <!-- LOGO -->

        <div class="logo">

            <img
                src="/image/logo.png"
                alt="JALworLD IPTV"
            >

            <h3>JALworLD IPTV</h3>

            <p>
                Enterprise Video Delivery Platform
            </p>

        </div>


        <!-- LOGIN TITLE -->

        <div class="login-title">

            <h2>
                <span class="gradient">IPTV & Streaming</span>
            </h2>

            <p>
                Sign in to access your IPTV platform
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-box">

                    <span>👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        class="password-toggle"
                        id="togglePassword"
                    >
                        👁
                    </span>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="options">

                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="footer">

            © <span id="year"></span>
            JALworLD MEDIA Streaming Technologies

        </div>

    </div>

</div>

<script>

const DEMO_USERNAME = "admin";
const DEMO_PASSWORD = "123456";

const IPTV_PAGE = "https://jalworldiptv.vercel.app/home";


const loginForm =
    document.getElementById("loginForm");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");

const forgotPassword =
    document.getElementById("forgotPassword");



togglePassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";

            togglePassword.textContent = "🙈";

        }else{

            password.type = "password";

            togglePassword.textContent = "👁";

        }

    }
);


loginForm.addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        const user =
            username.value.trim();

        const pass =
            password.value;


        /* Clear old message */

        message.className = "message";

        message.textContent = "";



        if(
            user === DEMO_USERNAME &&
            pass === DEMO_PASSWORD
        ){

            message.textContent =
                "Login successful. Redirecting...";

            message.className =
                "message success";

            sessionStorage.setItem(
                "jalworld_logged_in",
                "true"
            );

            setTimeout(function(){

                window.location.href =
                    IPTV_PAGE;

            },800);

        }else{

            message.textContent =
                "Invalid username or password.";

            message.className =
                "message error";

            password.value = "";

        }

    }
);

forgotPassword.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        message.textContent =
            "Please contact JALworLD IPTV support to reset your password.";

        message.className =
            "message error";

    }
);
document.getElementById("year").textContent =
    new Date().getFullYear();

</script>
